[project]
name = "harness-bench"
version = "0.1.0"
description = "Compare ways of working with Claude Code on cost, attention and defects."
requires-python = ">=3.12,<3.13"
dependencies = ["pandas"]

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
